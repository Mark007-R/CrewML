[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    slow: takes tens of seconds or more (model fits, full crew runs) — deselect with -m "not slow" for a fast pre-commit pass
    network: needs internet access (OpenML fetch, live LLM providers)
    docker: needs a running Docker daemon / redis container
filterwarnings =
    error::SyntaxWarning
    error:invalid escape sequence:DeprecationWarning
