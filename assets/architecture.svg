<svg viewBox="0 0 760 648" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="CrewML system architecture">
  <title>CrewML system architecture</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="648" fill="#ffffff"/>

  <text x="20" y="26" font-size="15" font-weight="600" fill="#1f2328">Clients</text>
  <rect x="20" y="38" width="220" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="130" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Streamlit dashboard :8501</text>
  <text x="130" y="78" text-anchor="middle" font-size="12" fill="#57606a">target chosen, never guessed</text>
  <rect x="260" y="38" width="180" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Any HTTP client</text>
  <text x="350" y="78" text-anchor="middle" font-size="12" fill="#57606a">same API, same rules</text>

  <line x1="130" y1="92" x2="130" y2="122" stroke="#57606a" marker-end="url(#ar)"/>
  <line x1="350" y1="92" x2="350" y2="122" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="20" y="124" width="720" height="86" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="32" y="146" font-size="13" font-weight="600" fill="#1f2328">FastAPI service :8000</text>
  <text x="32" y="164" font-size="12" fill="#57606a" font-family="Consolas, monospace">/upload  /run  /status  /report  /runs  /metrics  /healthz</text>
  <rect x="32" y="174" width="170" height="26" rx="6" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="117" y="191" text-anchor="middle" font-size="12" fill="#57606a">SQLite run store</text>
  <rect x="212" y="174" width="190" height="26" rx="6" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="307" y="191" text-anchor="middle" font-size="12" fill="#57606a">single-flight job runner</text>
  <rect x="412" y="174" width="180" height="26" rx="6" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="502" y="191" text-anchor="middle" font-size="12" fill="#57606a">cache: redis or file</text>
  <rect x="602" y="174" width="126" height="26" rx="6" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="665" y="191" text-anchor="middle" font-size="12" fill="#57606a">telemetry</text>

  <line x1="380" y1="210" x2="380" y2="240" stroke="#57606a" marker-end="url(#ar)"/>
  <text x="392" y="232" font-size="12" fill="#57606a">dataset id only — never a path</text>

  <rect x="20" y="242" width="720" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="32" y="264" font-size="13" font-weight="600" fill="#1f2328">LangGraph crew</text>
  <rect x="32" y="276" width="92" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="78" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Profiler</text>
  <text x="78" y="310" text-anchor="middle" font-size="11" fill="#57606a">EDA, leak screen</text>
  <rect x="138" y="276" width="92" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="184" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Planner</text>
  <text x="184" y="310" text-anchor="middle" font-size="11" fill="#57606a">models, CV plan</text>
  <rect x="244" y="276" width="102" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="295" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Feature eng.</text>
  <text x="295" y="310" text-anchor="middle" font-size="11" fill="#57606a">generates FE code</text>
  <rect x="360" y="276" width="92" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="406" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Trainer</text>
  <text x="406" y="310" text-anchor="middle" font-size="11" fill="#57606a">CV + self-repair</text>
  <rect x="466" y="276" width="92" height="44" rx="6" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="512" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Critic</text>
  <text x="512" y="310" text-anchor="middle" font-size="11" fill="#57606a">diagnose, decide</text>
  <rect x="572" y="276" width="92" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="618" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Ensembler</text>
  <text x="618" y="310" text-anchor="middle" font-size="11" fill="#57606a">combine best</text>
  <rect x="572" y="336" width="92" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="618" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Reporter</text>
  <text x="618" y="370" text-anchor="middle" font-size="11" fill="#57606a">report, model card</text>
  <line x1="124" y1="298" x2="138" y2="298" stroke="#57606a" marker-end="url(#ar)"/>
  <line x1="230" y1="298" x2="244" y2="298" stroke="#57606a" marker-end="url(#ar)"/>
  <line x1="346" y1="298" x2="360" y2="298" stroke="#57606a" marker-end="url(#ar)"/>
  <line x1="452" y1="298" x2="466" y2="298" stroke="#57606a" marker-end="url(#ar)"/>
  <line x1="558" y1="298" x2="572" y2="298" stroke="#57606a" marker-end="url(#ar)"/>
  <line x1="618" y1="320" x2="618" y2="336" stroke="#57606a" marker-end="url(#ar)"/>
  <path d="M512 276 L512 260 L184 260 L184 276" fill="none" stroke="#d97706" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="360" y="256" text-anchor="middle" font-size="11" fill="#b45309">iterate: specific fix instructions, max 3 loops</text>
  <text x="728" y="264" text-anchor="end" font-size="11" fill="#57606a">one shared state</text>

  <line x1="295" y1="392" x2="295" y2="420" stroke="#57606a" marker-end="url(#ar)"/>
  <rect x="20" y="422" width="470" height="66" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="32" y="444" font-size="13" font-weight="600" fill="#1f2328">Sandboxed executor</text>
  <text x="32" y="462" font-size="12" fill="#57606a">subprocess jail: import allowlist, no network, filesystem jail,</text>
  <text x="32" y="478" font-size="12" fill="#57606a">time and memory caps — all generated code runs here</text>

  <rect x="510" y="422" width="230" height="66" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="522" y="444" font-size="13" font-weight="600" fill="#1f2328">Honesty guards</text>
  <text x="522" y="462" font-size="12" fill="#57606a">leakage screen, budgets,</text>
  <text x="522" y="478" font-size="12" fill="#57606a">run manifest + fingerprint</text>

  <line x1="255" y1="488" x2="255" y2="516" stroke="#57606a" marker-end="url(#ar)"/>
  <rect x="20" y="518" width="330" height="66" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="32" y="540" font-size="13" font-weight="600" fill="#1f2328">Train split</text>
  <text x="32" y="558" font-size="12" fill="#57606a">the only data any agent can load —</text>
  <text x="32" y="574" font-size="12" fill="#57606a">benchmark or sealed upload alike</text>

  <rect x="410" y="518" width="330" height="66" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="1.8"/>
  <text x="422" y="540" font-size="13" font-weight="600" fill="#1f2328">Sealed holdout — SHA-256 locked</text>
  <text x="422" y="558" font-size="12" fill="#57606a">structurally unreachable from the crew;</text>
  <text x="422" y="574" font-size="12" fill="#57606a">read once by the final scorer only</text>
  <line x1="350" y1="551" x2="400" y2="551" stroke="#d97706" stroke-dasharray="4 3"/>

  <text x="380" y="620" text-anchor="middle" font-size="11.5" fill="#57606a">Amber outline = the honesty boundary: the critique loop that must earn its keep, and the holdout the crew can never touch.</text>
</svg>
